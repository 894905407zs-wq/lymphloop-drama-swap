name: tests

# The skill's own test suite on macOS and Windows. No paid API is called and no key is needed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: skills/lymphloop-drama-swap
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: skills/lymphloop-drama-swap/requirements.txt
      - name: Python packages
        run: python -m pip install -r requirements.txt
      - name: RapidOCR on macOS too (the tests compare it with Vision)
        if: runner.os == 'macOS'
        run: python -m pip install "rapidocr==3.10.0"
      - name: ffmpeg
        # the skill burns timecodes with the drawtext filter; Homebrew's plain ffmpeg is built without it
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then choco install ffmpeg -y --no-progress
          else brew install ffmpeg-full && echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"; fi
      - name: ffmpeg has drawtext
        run: |
          ffmpeg -version | head -1
          ffmpeg -hide_banner -filters | grep -E " drawtext "
      - name: This machine
        run: python scripts/oscompat.py
      - name: Tests
        run: python tests/run_ci.py
